[package]
name = "purg-kernel"
description = "The native aarch64 kernel for QEMU virt"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "purg-kernel"
path = "src/main.rs"
test = false
bench = false

# A small build leaves these out (`--no-default-features`); the test mode
# needs all of them. docs/footprint.md has the sizes.
[features]
default = ["tls", "net", "p9", "lethe"]
# `#D`, the TLS client device.
tls = ["purg-core/tls"]
# `#λ`, the Lethe client (docs/lethe.md). Without `net` it has nothing to dial.
lethe = ["purg-core/lethe"]
# `#I` over virtio-net and smoltcp.
net = ["purg-aarch64/net"]
# `#9`, a host directory over virtio-9p, mounted on `/n/host`.
p9 = ["purg-aarch64/p9"]

[dependencies]
purg-aarch64.workspace = true

[target.'cfg(target_os = "none")'.dependencies]
linked_list_allocator = { version = "0.10", default-features = false, features = ["use_spin"] }
purg-platform.workspace = true
purg-abi.workspace = true
purg-core.workspace = true
purg-styx.workspace = true
purg-vm.workspace = true
purg-vm-wasmi.workspace = true
spin.workspace = true

[lints]
workspace = true
