[workspace]
resolver = "3"
members = [
    # Globs, so a new crate needs no edit here (and parallel branches do not
    # conflict on this list). Every directory a glob matches must hold a
    # Cargo.toml: a directory of commands such as `appl/cmd/ndb` goes in
    # `exclude`, and each crate inside it is listed here by path (an
    # explicit member wins over `exclude`; a glob under it does not).
    "crates/*",
    "sdk/*",
    "appl/cmd/*",
    "appl/lib/*",
    "appl/test/*",
    # Commands in a subdirectory, installed as /bin/<dir>/<name>.wasm.
    "appl/cmd/ndb/cs",
    "appl/cmd/ndb/csquery",
    "appl/cmd/ndb/dns",
    "appl/cmd/ndb/dnsquery",
    "appl/cmd/ndb/query",
    "appl/cmd/ndb/registry",
    "appl/cmd/ndb/regquery",
    "appl/cmd/install/ckproto",
    "appl/cmd/install/mkproto",
    "appl/cmd/install/proto2list",
    "appl/cmd/disk/mkext",
    "appl/cmd/disk/chkdisk",
    "appl/cmd/disk/mkdisk",
    "appl/cmd/disk/mkfs",
    "appl/cmd/ip/dhcp",
    "appl/cmd/ip/ping",
    "appl/cmd/ip/sntp",
    "appl/cmd/ip/tftpd",
    "appl/cmd/ip/virgild",
    "appl/cmd/auxi/cpuslave",
    "appl/cmd/auxi/rstyxd",
    "appl/cmd/auth/changelogin",
    "appl/cmd/auth/countersigner",
    "appl/cmd/auth/createsignerkey",
    "appl/cmd/auth/factotum",
    "appl/cmd/auth/getpk",
    "appl/cmd/auth/keyfs",
    "appl/cmd/auth/keysrv",
    "appl/cmd/auth/mkauthinfo",
    "appl/cmd/auth/modpolicy",
    "appl/cmd/auth/passwd",
    "appl/cmd/auth/secstore",
    "appl/cmd/auth/sign",
    "appl/cmd/auth/signer",
    "appl/cmd/auth/verify",
    # Libraries shared by commands, outside the globbed directories.
    "appl/archive",
    "appl/authlib",
    "xtask",
]
# Matched by appl/cmd/* but hold crates, with no Cargo.toml of their own.
exclude = ["appl/cmd/ndb", "appl/cmd/install", "appl/cmd/disk", "appl/cmd/ip", "appl/cmd/auth", "appl/cmd/auxi"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
repository = "https://github.com/ericvh/purgatorio"

[workspace.dependencies]
purg-abi = { path = "crates/purg-abi" }
purg-auth = { path = "crates/purg-auth", default-features = false }
purg-lethe = { path = "crates/purg-lethe" }
purg-styx = { path = "crates/purg-styx" }
purg-platform = { path = "crates/purg-platform" }
purg-fs = { path = "crates/purg-fs", default-features = false }
purg-system = { path = "crates/purg-system" }
# Without default features: the kernel can be built without them (its
# `tls`, `net` and `p9` features; docs/footprint.md). The emu and the
# probe name the ones they use.
purg-core = { path = "crates/purg-core", default-features = false }
purg-vm = { path = "crates/purg-vm" }
purg-vm-wasmtime = { path = "crates/purg-vm-wasmtime" }
purg-vm-wasmi = { path = "crates/purg-vm-wasmi" }
purg-vm-aot = { path = "crates/purg-vm-aot", default-features = false }
purg-aarch64 = { path = "crates/purg-aarch64", default-features = false }
purgatorio = { path = "sdk/purgatorio" }
purgatorio-macros = { path = "sdk/purgatorio-macros" }
appl-archive = { path = "appl/archive" }
authlib = { package = "appl-authlib", path = "appl/authlib" }
filepat = { package = "appl-lib-filepat", path = "appl/lib/filepat" }
regexp = { package = "appl-lib-regexp", path = "appl/lib/regexp" }
wasmobj = { package = "appl-lib-wasmobj", path = "appl/lib/wasmobj" }
ndb = { package = "appl-lib-ndb", path = "appl/lib/ndb" }

spin = { version = "0.10", default-features = false, features = ["mutex", "spin_mutex", "rwlock", "once"] }
libc = "0.2"
dlmalloc = { version = "0.2", features = ["global"] }
wasmi = { version = "2", default-features = false, features = ["stable", "validate", "libm", "auto-dispatch"] }
wasmtime = { version = "50", default-features = false, features = ["cranelift", "runtime", "std"] }
# The runtime alone, without std, for precompiled modules in the kernel
# (purg-vm-aot, docs/perf.md). Must be the same version as `wasmtime`.
wasmtime-runtime = { package = "wasmtime", version = "50", default-features = false, features = ["runtime", "custom-sync-primitives", "pulley"] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(loom)"] }

[workspace.lints.clippy]
dbg_macro = "warn"

[profile.dev]
panic = "unwind"

# Debug builds of the compiler take seconds per guest module; optimizing
# just these keeps the acceptance tests fast.
[profile.dev.package.cranelift-codegen]
opt-level = 2

[profile.dev.package.cranelift-frontend]
opt-level = 2

[profile.dev.package.regalloc2]
opt-level = 2

[profile.dev.package.wasmparser]
opt-level = 2

# The same for the interpreter: guests run in it, and a debug wasmi runs
# them ten times slower or more (Argon2 with the default cost takes over
# a minute).
[profile.dev.package.wasmi]
opt-level = 2

[profile.dev.package.wasmi_core]
opt-level = 2

[profile.dev.package.wasmi_ir]
opt-level = 2

[profile.dev.package.wasmi_collections]
opt-level = 2

[profile.wasm]
inherits = "release"
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
# The linker keeps the name section so that `cargo xtask build-root` can
# write each guest's function names to a `.names` file for `stack` and
# `prof`. That section also records the output file name, which carries a
# Cargo hash of the build host, so `build-root` removes it (with the
# `producers` and `target_features` sections) from the module it installs:
# the installed modules are what `strip = "symbols"` would give, and stay
# byte-identical across hosts.
strip = "debuginfo"

[profile.probe]
inherits = "release"
panic = "abort"

# The kernel is built for size except where speed is bought cheaply
# (docs/footprint.md has the measurements). Everything is `opt-level = "z"`
# with fat LTO, but the interpreter, wasmi, stays at 3: guests run at the
# speed of its dispatch loop, and at "z" a CPU-bound guest takes 1.5 times
# as long. Do not use "s": wasmi's dispatch relies on LLVM turning its
# calls into jumps, and at "s" a prog's kernel stack went from 22 KiB to
# more than 2 MiB in the test mode (the scheduler's stack check panics).
[profile.kernel]
inherits = "release"
panic = "abort"
opt-level = "z"
lto = "fat"
codegen-units = 1

[profile.kernel.package.wasmi]
opt-level = 3

[profile.kernel.package.wasmi_core]
opt-level = 3

[profile.kernel.package.wasmi_ir]
opt-level = 3

[profile.kernel.package.wasmi_collections]
opt-level = 3

# SHA-256 too: the loader takes every module's digest for the module
# policy, so it is part of each spawn. At 3 a spawn is 13% cheaper on
# wasmi and a third cheaper with AOT (docs/perf.md).
[profile.kernel.package.sha2]
opt-level = 3

# The same for the experimental `aot` feature's engine (docs/perf.md):
# Pulley's interpreter, and wasmtime's runtime under native code. They
# are not in a kernel built without it.
[profile.kernel.package.pulley-interpreter]
opt-level = 3

[profile.kernel.package.wasmtime]
opt-level = 3

# The smallest kernel: the interpreter built for size as well. Used with
# `--no-default-features` by `cargo xtask size --small`.
[profile.kernel-small]
inherits = "kernel"

[profile.kernel-small.package.wasmi]
opt-level = "z"

[profile.kernel-small.package.wasmi_core]
opt-level = "z"

[profile.kernel-small.package.wasmi_ir]
opt-level = "z"

[profile.kernel-small.package.wasmi_collections]
opt-level = "z"

[profile.kernel-small.package.sha2]
opt-level = "z"
