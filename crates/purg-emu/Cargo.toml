[package]
name = "purg-emu"
description = "Purgatorio hosted emulator for Linux and macOS"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "emu"
path = "src/main.rs"

[dependencies]
purg-abi.workspace = true
purg-core = { workspace = true, features = ["std"] }
purg-platform = { workspace = true, features = ["std"] }
purg-styx.workspace = true
purg-vm.workspace = true
purg-vm-wasmi.workspace = true
purg-vm-wasmtime.workspace = true
libc.workspace = true

[lints]
workspace = true

[dev-dependencies]
rcgen = { version = "0.13", default-features = false, features = ["ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
