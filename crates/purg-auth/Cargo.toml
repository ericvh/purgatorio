[package]
name = "purg-auth"
description = "Purgatorio authentication formats and protocols: certificates, mount proofs, the pglogin1 password exchange, sealing"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
# Certificates and mount proofs are always built; the kernel needs only
# those. `login` adds SPAKE2, Argon2id and ChaCha20-Poly1305 for the
# password exchange and the encrypted stores the guests use.
default = ["login"]
login = ["dep:spake2", "dep:argon2", "dep:chacha20poly1305", "dep:hkdf", "dep:hmac"]

[dependencies]
purg-abi.workspace = true
# `fast` builds the basepoint tables at compile time: key generation and
# signing are several times quicker, which matters under an interpreter.
ed25519-dalek = { version = "2", default-features = false, features = ["fast"] }
sha2 = { version = "0.10", default-features = false }
rand_core = { version = "0.6", default-features = false }
spake2 = { version = "0.4", default-features = false, optional = true }
argon2 = { version = "0.5", default-features = false, features = ["alloc"], optional = true }
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"], optional = true }
hkdf = { version = "0.12", default-features = false, optional = true }
hmac = { version = "0.12", default-features = false, optional = true }

[lints]
workspace = true
