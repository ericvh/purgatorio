[workspace]
resolver = "3"
members = [
    # Globs, so a new crate needs no edit here (and parallel branches do not
    # conflict on this list). Every directory a glob matches must hold a
    # Cargo.toml: a directory of commands such as `appl/cmd/ndb` goes in
    # `exclude`, and each crate inside it is listed here by path (an
    # explicit member wins over `exclude`; a glob under it does not).
    "crates/*",
    "sdk/*",
    "appl/cmd/*",
    "appl/lib/*",
    "appl/test/*",
    # Commands in a subdirectory, installed as /bin/ndb/<name>.wasm.
    "appl/cmd/ndb/query",
    # Libraries shared by commands, outside the globbed directories.
    "appl/archive",
    "xtask",
]
# Matched by appl/cmd/* but holds crates, not a Cargo.toml of its own.
exclude = ["appl/cmd/ndb"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
repository = "https://github.com/ericvh/purgatorio"

[workspace.dependencies]
purg-abi = { path = "crates/purg-abi" }
purg-styx = { path = "crates/purg-styx" }
purg-platform = { path = "crates/purg-platform" }
purg-core = { path = "crates/purg-core" }
purg-vm = { path = "crates/purg-vm" }
purg-vm-wasmtime = { path = "crates/purg-vm-wasmtime" }
purg-vm-wasmi = { path = "crates/purg-vm-wasmi" }
purg-aarch64 = { path = "crates/purg-aarch64" }
purgatorio = { path = "sdk/purgatorio" }
purgatorio-macros = { path = "sdk/purgatorio-macros" }
appl-archive = { path = "appl/archive" }
regexp = { package = "appl-lib-regexp", path = "appl/lib/regexp" }

spin = { version = "0.10", default-features = false, features = ["mutex", "spin_mutex", "rwlock", "once"] }
libc = "0.2"
dlmalloc = { version = "0.2", features = ["global"] }
wasmi = { version = "2", default-features = false, features = ["stable", "validate", "libm", "auto-dispatch"] }
wasmtime = { version = "50", default-features = false, features = ["cranelift", "runtime", "std"] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(loom)"] }

[workspace.lints.clippy]
dbg_macro = "warn"

[profile.dev]
panic = "unwind"

# Debug builds of the compiler take seconds per guest module; optimizing
# just these keeps the acceptance tests fast.
[profile.dev.package.cranelift-codegen]
opt-level = 2

[profile.dev.package.cranelift-frontend]
opt-level = 2

[profile.dev.package.regalloc2]
opt-level = 2

[profile.dev.package.wasmparser]
opt-level = 2

[profile.wasm]
inherits = "release"
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
# The name section records the output file name, which carries a Cargo hash
# of the build host; stripping it keeps guest modules byte-identical across
# hosts.
strip = "symbols"

[profile.probe]
inherits = "release"
panic = "abort"

[profile.kernel]
inherits = "release"
panic = "abort"
