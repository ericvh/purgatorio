[package]
name = "purg-auth"
description = "Purgatorio authentication formats and protocols: certificates, mount proofs, the pglogin1 password exchange, sealing"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
# Certificates, mount proofs, the session key exchange and the record
# layer are always built; the kernel needs those. `login` adds SPAKE2 and
# Argon2id for the password exchange and the encrypted stores the guests
# use.
default = ["login"]
login = ["dep:spake2", "dep:argon2", "dep:hmac"]
# The record layer's cipher from `ring` instead of RustCrypto: about three
# times faster, same records. Only the hosted emu turns it on; the kernel
# and the guests keep the `no_std` crate.
ring = ["dep:ring"]

[dependencies]
purg-abi.workspace = true
# `fast` builds the basepoint tables at compile time: key generation and
# signing are several times quicker, which matters under an interpreter.
ed25519-dalek = { version = "2", default-features = false, features = ["fast"] }
# X25519 for the mount handshake's session key. Already in the graph
# through ed25519-dalek.
curve25519-dalek = { version = "4.1", default-features = false }
sha2 = { version = "0.10", default-features = false }
rand_core = { version = "0.6", default-features = false }
spake2 = { version = "0.4", default-features = false, optional = true }
argon2 = { version = "0.5", default-features = false, features = ["alloc"], optional = true }
# The record layer's AEAD, and `login`'s. 0.11's ChaCha20 uses NEON on
# aarch64 (docs/perf.md).
chacha20poly1305 = { version = "0.11", default-features = false, features = ["alloc"] }
hkdf = { version = "0.12", default-features = false }
# ML-KEM-768 (FIPS 203) for the hybrid key exchange of proof version 4
# and crypt's public-key mode (docs/auth.md, "Post-quantum options").
ml-kem = { version = "0.3.4", default-features = false }
hmac = { version = "0.12", default-features = false, optional = true }
ring = { version = "0.17", default-features = false, optional = true }

[lints]
workspace = true
