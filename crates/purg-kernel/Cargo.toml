[package]
name = "purg-kernel"
description = "The native aarch64 kernel for QEMU virt"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "purg-kernel"
path = "src/main.rs"
test = false
bench = false

# A small build leaves these out (`--no-default-features`); the test mode
# needs all of them. docs/footprint.md has the sizes.
[features]
default = ["tls", "net", "p9", "lethe", "blk"]
# `#D`, the TLS client device.
tls = ["purg-core/tls"]
# `#λ`, the Lethe client (docs/lethe.md). Without `net` it has nothing to dial.
lethe = ["purg-core/lethe"]
# `#I` over virtio-net and smoltcp.
net = ["purg-aarch64/net"]
# `#9`, a host directory over virtio-9p, mounted on `/n/host`.
p9 = ["purg-aarch64/p9"]
# `#S`, the virtio-blk disks, and a purgfs on one of them as `#K` on
# `/n/disk` (docs/fs.md).
blk = ["purg-aarch64/blk", "dep:purg-fs"]
# Experimental: the modules `xtask bench --aot` compiled ahead of time run
# on wasmtime's `no_std` runtime, the rest on wasmi (docs/perf.md).
aot = ["dep:purg-vm-aot"]

[dependencies]
purg-aarch64.workspace = true

[target.'cfg(target_os = "none")'.dependencies]
purg-platform.workspace = true
purg-abi.workspace = true
purg-auth.workspace = true
purg-core.workspace = true
purg-styx.workspace = true
purg-system.workspace = true
purg-fs = { workspace = true, features = ["dev"], optional = true }
purg-vm.workspace = true
purg-vm-wasmi.workspace = true
purg-vm-aot = { workspace = true, optional = true }
spin.workspace = true

[lints]
workspace = true
