[workspace]
resolver = "3"
members = [
    "crates/purg-abi",
    "crates/purg-styx",
    "crates/purg-platform",
    "crates/purg-core",
    "crates/purg-vm",
    "crates/purg-vm-wasmtime",
    "crates/purg-vm-wasmi",
    "crates/purg-emu",
    "crates/purg-probe",
    "sdk/purgatorio",
    "sdk/purgatorio-macros",
    "appl/cmd/bind",
    "appl/cmd/cmp",
    "appl/cmd/cat",
    "appl/cmd/cp",
    "appl/cmd/date",
    "appl/cmd/diff",
    "appl/cmd/du",
    "appl/cmd/echo",
    "appl/cmd/emuinit",
    "appl/cmd/env",
    "appl/cmd/fc",
    "appl/cmd/grep",
    "appl/cmd/kill",
    "appl/cmd/ls",
    "appl/cmd/md5sum",
    "appl/cmd/memfs",
    "appl/cmd/mkdir",
    "appl/cmd/mount",
    "appl/cmd/mv",
    "appl/cmd/ns",
    "appl/cmd/ps",
    "appl/cmd/pwd",
    "appl/cmd/ramfile",
    "appl/cmd/rm",
    "appl/cmd/sed",
    "appl/cmd/sh",
    "appl/cmd/sleep",
    "appl/cmd/tail",
    "appl/cmd/tee",
    "appl/cmd/unmount",
    "appl/cmd/wc",
    "appl/cmd/xd",
    "appl/test/abi",
    "appl/test/m3",
    "appl/test/procs",
    "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
repository = "https://github.com/ericvh/purgatorio"

[workspace.dependencies]
purg-abi = { path = "crates/purg-abi" }
purg-styx = { path = "crates/purg-styx" }
purg-platform = { path = "crates/purg-platform" }
purg-core = { path = "crates/purg-core" }
purg-vm = { path = "crates/purg-vm" }
purg-vm-wasmtime = { path = "crates/purg-vm-wasmtime" }
purg-vm-wasmi = { path = "crates/purg-vm-wasmi" }
purgatorio = { path = "sdk/purgatorio" }
purgatorio-macros = { path = "sdk/purgatorio-macros" }

spin = { version = "0.10", default-features = false, features = ["mutex", "spin_mutex", "rwlock", "once"] }
libc = "0.2"
dlmalloc = { version = "0.2", features = ["global"] }
wasmi = { version = "2", default-features = false, features = ["stable", "validate", "libm", "auto-dispatch"] }
wasmtime = { version = "50", default-features = false, features = ["cranelift", "runtime", "std"] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(loom)"] }

[workspace.lints.clippy]
dbg_macro = "warn"

[profile.dev]
panic = "unwind"

# Debug builds of the compiler take seconds per guest module; optimizing
# just these keeps the acceptance tests fast.
[profile.dev.package.cranelift-codegen]
opt-level = 2

[profile.dev.package.cranelift-frontend]
opt-level = 2

[profile.dev.package.regalloc2]
opt-level = 2

[profile.dev.package.wasmparser]
opt-level = 2

[profile.wasm]
inherits = "release"
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
# The name section records the output file name, which carries a Cargo hash
# of the build host; stripping it keeps guest modules byte-identical across
# hosts.
strip = "symbols"

[profile.probe]
inherits = "release"
panic = "abort"
