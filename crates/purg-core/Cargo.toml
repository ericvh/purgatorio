[package]
name = "purg-core"
description = "Portable Purgatorio kernel core: channels, devices, namespaces, progs, Sys file ops"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = ["tls", "lethe", "draw"]
std = ["purg-platform/std"]
# `#D`, the TLS 1.3 client device.
tls = ["dep:embedded-tls", "dep:p256", "dep:sha2", "dep:embedded-io", "dep:rand_core"]
# `#λ`, the Lethe client (docs/lethe.md).
lethe = ["dep:purg-lethe"]
# `#i`, `#m` and `#c/keyboard`, when the platform has a screen
# (docs/graphics.md).
draw = ["dep:purg-memdraw"]

[dependencies]
purg-abi.workspace = true
purg-auth.workspace = true
purg-lethe = { workspace = true, optional = true }
purg-memdraw = { workspace = true, optional = true }
purg-styx.workspace = true
purg-platform.workspace = true
embedded-tls = { version = "0.19", default-features = false, features = ["alloc"], optional = true }
p256 = { version = "0.13", default-features = false, features = ["ecdsa", "pkcs8"], optional = true }
sha2 = { version = "0.10", default-features = false, optional = true }
embedded-io = { version = "0.7", default-features = false, optional = true }
rand_core = { version = "0.6", default-features = false, optional = true }

[target.'cfg(loom)'.dev-dependencies]
loom = "0.7"

[lints]
workspace = true

# This test checks the whole device list.
[[test]]
name = "namespace"
required-features = ["tls"]
