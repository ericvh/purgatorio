[package]
name = "purg-core"
description = "Portable Purgatorio kernel core: channels, devices, namespaces, progs, Sys file ops"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = []
std = ["purg-platform/std"]

[dependencies]
purg-abi.workspace = true
purg-styx.workspace = true
purg-platform.workspace = true
ed25519-dalek = { version = "2", default-features = false }
embedded-tls = { version = "0.19", default-features = false, features = ["alloc"] }
p256 = { version = "0.13", default-features = false, features = ["ecdsa", "pkcs8"] }
sha2 = { version = "0.10", default-features = false }
embedded-io = { version = "0.7", default-features = false }
rand_core = { version = "0.6", default-features = false }

[target.'cfg(loom)'.dev-dependencies]
loom = "0.7"

[lints]
workspace = true
