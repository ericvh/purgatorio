name: bench

# The benchmark suite (docs/perf.md), by hand only: it takes minutes and
# its numbers depend on the runner. GitHub's runners have no KVM, so the
# kernel runs under TCG; KVM numbers come from a developer's aarch64 host.
on:
  workflow_dispatch:
    inputs:
      args:
        description: cargo xtask bench arguments
        default: --emu --tcg --rounds 2
        required: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  bench:
    name: xtask bench (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/toolchain
      - uses: Swatinem/rust-cache@v2
      - name: install QEMU
        run: sudo apt-get update -q && sudo apt-get install -y -q qemu-system-arm
      - name: bench
        env:
          ARGS: ${{ inputs.args }}
        # Split into words on purpose.
        run: cargo xtask bench $ARGS
      - uses: actions/upload-artifact@v4
        with:
          name: bench-${{ matrix.os }}
          path: target/bench/results.json
