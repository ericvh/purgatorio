[package]
name = "purg-lethe"
description = "Lethe, a stateless protocol for static file trees: codec, tickets, server engine and client (docs/lethe.md)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
# The AEAD from `ring` (with an HChaCha20 subkey) instead of the RustCrypto
# crates: the same XChaCha20-Poly1305, several times faster. Only the
# hosted emu and `lethed` turn it on; the kernel keeps the `no_std` crates.
ring = ["dep:ring"]

[dependencies]
purg-abi.workspace = true
purg-auth.workspace = true
purg-styx.workspace = true
# XChaCha20-Poly1305 is built from ChaCha20 and Poly1305 here
# (`crypto::aead`): `chacha20` 0.10 picks its NEON backend at compile time
# on aarch64, where 0.9 needed a `--cfg`.
chacha20 = { version = "0.10", default-features = false, features = ["cipher", "xchacha"] }
poly1305 = { version = "0.9", default-features = false }
ring = { version = "0.17", default-features = false, optional = true }
hkdf = { version = "0.12", default-features = false }
sha2 = { version = "0.10", default-features = false }

[dev-dependencies]
# The reference the AEAD is checked against, both directions.
chacha20poly1305 = { version = "0.11", default-features = false, features = ["alloc"] }

[lints]
workspace = true
