name: CI

on:
  push:
    # main, and next: the integration branch where pull requests land first.
    branches: [main, next]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # Decides what the rest of CI needs to do. Pushes to main (and manual
  # runs) do everything. A pull request that changes only documentation
  # skips the build and test jobs, and runs loom only when the code its
  # models cover changed. Skipped jobs count as passed for status checks.
  changes:
    name: what changed
    runs-on: ubuntu-24.04
    outputs:
      code: ${{ steps.f.outputs.code }}
      loom: ${{ steps.f.outputs.loom }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: f
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != pull_request ]; then
            echo code=true >> "$GITHUB_OUTPUT"; echo loom=true >> "$GITHUB_OUTPUT"; exit 0
          fi
          code=false loom=false
          while read -r f; do
            [ -z "$f" ] && continue
            case "$f" in
              *.md|docs/*|LICENSE) ;;
              *) code=true ;;
            esac
            # What the loom models in crates/purg-core/tests/loom.rs use.
            case "$f" in
              crates/purg-platform/src/*|crates/purg-core/tests/loom.rs|\
              crates/purg-core/src/qio.rs|crates/purg-core/src/mux.rs|\
              crates/purg-core/src/kchan.rs|crates/purg-core/src/block.rs|\
              crates/purg-core/src/chan.rs|crates/purg-core/src/error.rs|\
              Cargo.lock|rust-toolchain.toml|.github/*) loom=true ;;
            esac
          done < <(git diff --name-only "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}")
          echo "code=$code loom=$loom"
          echo "code=$code" >> "$GITHUB_OUTPUT"; echo "loom=$loom" >> "$GITHUB_OUTPUT"

  lint:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: fmt and lints
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/toolchain
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - name: clippy (guests, wasm32-wasip1)
        run: cargo xtask clippy-guests
      - name: root/ is free of case collisions
        run: |
          dups=$(git ls-files root | tr '[:upper:]' '[:lower:]' | sort | uniq -d)
          if [ -n "$dups" ]; then echo "case collisions in root/: $dups"; exit 1; fi

  test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/toolchain
      - uses: Swatinem/rust-cache@v2
      - name: clippy (host)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: build guest binaries into root/
        run: cargo xtask build-root
      - name: unit and acceptance tests (wasmtime and wasmi)
        run: cargo test --workspace
      - name: experimental no_std and multi-call guests (docs/footprint.md)
        if: runner.os == 'Linux'
        run: cargo xtask small
      - name: xtask run-emu smoke test
        shell: bash
        run: |
          set -euo pipefail
          for vm in wasmtime wasmi; do
            out=$(cargo xtask run-emu -- --vm=$vm echo hello world 2>/dev/null)
            test "$out" = "hello world"
            out=$(echo hi | cargo xtask run-emu -- --vm=$vm cat 2>/dev/null)
            test "$out" = "hi"
            if cargo xtask run-emu -- --vm=$vm cat /nonexistent >/tmp/out 2>/dev/null; then
              echo "cat /nonexistent succeeded"; exit 1
            fi
            grep -qx 'cat: /nonexistent: file does not exist' /tmp/out
          done
      - name: case-exact names on a case-sensitive APFS volume
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          hdiutil create -size 64m -fs "Case-sensitive APFS" -volname purgcs /tmp/cs.dmg
          hdiutil attach /tmp/cs.dmg -mountpoint /tmp/cs
          cp -R root /tmp/cs/root
          test "$(target/debug/emu -r /tmp/cs/root cat /lib/probe/hello.txt)" = "hello from the probe root"
          if target/debug/emu -r /tmp/cs/root cat /LIB/probe/hello.txt; then exit 1; fi
          # A fresh volume can still be busy (Spotlight, disk arbitration)
          # just after the checks; give it a moment, then force it.
          hdiutil detach /tmp/cs || { sleep 3; hdiutil detach -force /tmp/cs; }
      - name: record guest module hashes
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/wasm" && cp -R root/bin "$RUNNER_TEMP/wasm/"
          # Signing is a separate step and deterministic: one module signed
          # with the public test key must also hash the same on every host.
          cargo xtask sign root/bin/echo.wasm --key root/lib/test/auth.key -o "$RUNNER_TEMP/wasm/signed-echo.wasm"
          cd root && find bin -name '*.wasm' | sort | xargs shasum -a 256 > "$RUNNER_TEMP/wasm/wasm-sha256.txt"
          (cd "$RUNNER_TEMP/wasm" && shasum -a 256 signed-echo.wasm) >> "$RUNNER_TEMP/wasm/wasm-sha256.txt"
          cat "$RUNNER_TEMP/wasm/wasm-sha256.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: wasm-sha256-${{ matrix.os }}
          path: ${{ runner.temp }}/wasm

  reproducible:
    name: guest modules are byte-identical across hosts
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wasm-sha256-*
      - run: |
          set -euo pipefail
          ls -R
          first=$(ls -d wasm-sha256-* | head -1)
          for d in wasm-sha256-*; do
            echo "== $d"; diff "$first/wasm-sha256.txt" "$d/wasm-sha256.txt"
          done

  probe:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: purg-probe in QEMU aarch64 (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/toolchain
      - uses: Swatinem/rust-cache@v2
      - name: install QEMU
        run: sudo apt-get update -q && sudo apt-get install -y -q qemu-system-arm
      - name: clippy
        run: >
          cargo xtask build-root &&
          cargo clippy -p purg-probe --target aarch64-unknown-none --profile probe -- -D warnings
      - name: xtask probe
        run: cargo xtask probe

  kernel:
    name: purg-kernel in QEMU aarch64 (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/toolchain
      - uses: Swatinem/rust-cache@v2
      - name: install QEMU
        run: sudo apt-get update -q && sudo apt-get install -y -q qemu-system-arm
      - name: clippy
        run: >
          cargo clippy -p purg-kernel -p purg-aarch64
          --target aarch64-unknown-none --profile kernel -- -D warnings
      - name: clippy (small build, without tls, net and p9)
        run: >
          cargo clippy -p purg-kernel -p purg-aarch64
          --target aarch64-unknown-none --profile kernel --no-default-features -- -D warnings
      - name: xtask kernel (TCG, GICv2, GICv3, EL2)
        run: cargo xtask kernel
      - name: size report (docs/footprint.md)
        run: cargo xtask size

  loom:
    name: loom models (Rendez, qio)
    needs: changes
    if: needs.changes.outputs.loom == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/toolchain
      - uses: Swatinem/rust-cache@v2
      - name: loom
        env:
          RUSTFLAGS: --cfg loom -D warnings
          CARGO_TARGET_DIR: target/loom
        # Pull requests bound the preemptions loom explores (5 takes under a
        # second; unbounded takes about 20 minutes). Pushes to main run the
        # models unbounded, after every merge.
        run: |
          if [ "${{ github.event_name }}" = pull_request ]; then export LOOM_MAX_PREEMPTIONS=5; fi
          cargo test -p purg-core --features std --test loom --release

  no-std:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: shared crates on aarch64-unknown-none (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/toolchain
      - uses: Swatinem/rust-cache@v2
      - name: build
        run: >
          cargo build --target aarch64-unknown-none
          -p purg-abi -p purg-auth -p purg-styx -p purg-platform -p purg-core -p purg-vm -p purg-vm-wasmi
          -p purg-aarch64
      - name: clippy
        run: >
          cargo clippy --target aarch64-unknown-none
          -p purg-abi -p purg-auth -p purg-styx -p purg-platform -p purg-core -p purg-vm -p purg-vm-wasmi
          -p purg-aarch64
          -- -D warnings

  # License and source policy (deny.toml, plan decision D1), and a check
  # that the cargo-fuzz targets still compile. Nothing here needs nightly:
  # running the fuzzers is a manual job (docs/plan.md Section 9.3).
  deny:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: licenses, sources and fuzz targets
    runs-on: ubuntu-24.04
    env:
      # Pinned: a new cargo-deny can change what the checks mean. Bump it
      # in a pull request of its own.
      CARGO_DENY_VERSION: 0.20.2
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/toolchain
      - name: cache the cargo-deny binary
        id: deny-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-deny
          key: cargo-deny-${{ env.CARGO_DENY_VERSION }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml') }}
      - name: install cargo-deny
        if: steps.deny-cache.outputs.cache-hit != 'true'
        env:
          # -D warnings is for our code, not for a tool's dependencies.
          RUSTFLAGS: ""
        run: cargo install --locked cargo-deny --version "$CARGO_DENY_VERSION"
      - name: licenses, bans and sources
        run: cargo deny check licenses bans sources
      - name: licenses, bans and sources of the fuzz targets
        run: cargo deny --manifest-path fuzz/Cargo.toml --config deny.toml check licenses bans sources
      - name: fuzz targets compile
        run: cargo check --manifest-path fuzz/Cargo.toml
      # The advisory database changes under us, so a new advisory must not
      # turn an unrelated pull request red. The step shows as failed in the
      # log; the job does not fail.
      - name: advisories (reported, does not fail the job)
        continue-on-error: true
        run: cargo deny check advisories
