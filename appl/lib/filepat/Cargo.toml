[package]
name = "appl-lib-filepat"
description = "filepat: file name patterns (filepat(2)) for sh and mash"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# A plain library linked into the commands that use it, not a reactor
# module: xtask installs only the cdylib crates in appl/lib.
[lib]
name = "filepat"
path = "src/lib.rs"

[dependencies]
purgatorio.workspace = true

[lints]
workspace = true
