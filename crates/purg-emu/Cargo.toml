[package]
name = "purg-emu"
description = "Purgatorio hosted emulator for Linux and macOS"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "emu"
path = "src/main.rs"

# The Lethe server (docs/lethe.md): host files with #U's host semantics.
[[bin]]
name = "lethed"
path = "src/bin/lethed.rs"

[dependencies]
purg-abi.workspace = true
# `ring`'s ChaCha20-Poly1305 for the mount's record layer: about three
# times the RustCrypto crate's speed on the hosts' CPUs (docs/auth.md,
# "Cost"). The records are the same bytes; the kernel keeps the no_std
# cipher.
purg-auth = { workspace = true, features = ["ring"] }
purg-lethe = { workspace = true, features = ["ring"] }
purg-core = { workspace = true, features = ["std", "tls", "lethe", "draw"] }
purg-platform = { workspace = true, features = ["std"] }
purg-styx.workspace = true
purg-vm.workspace = true
purg-vm-wasmi.workspace = true
purg-vm-wasmtime.workspace = true
libc.workspace = true
# The window for `emu -g` (docs/graphics.md): winit for the window and its
# events, softbuffer to show a CPU framebuffer in it. X11 and Wayland on
# Linux (loaded at run time, so the emu runs without them), AppKit on
# macOS. No client-side decorations, which would pull in a font renderer.
winit = { version = "0.30.13", default-features = false, features = ["rwh_06", "x11", "wayland", "wayland-dlopen"] }
softbuffer = "0.4.8"
# The screen in a browser for `emu -w` (src/web.rs): SHA-1 for the
# WebSocket handshake and zlib for the pixels. Both are already in the
# graph (purg-auth's cipher, the archive guests); the HTTP and WebSocket
# code is ours.
ring = { version = "0.17", default-features = false }
miniz_oxide = { version = "0.8", default-features = false, features = ["with-alloc"] }

[lints]
workspace = true

[dev-dependencies]
# The default font's widths, for where text lands on the screen in
# tests/acme.rs.
purg-memdraw.workspace = true
rcgen = { version = "0.13", default-features = false, features = ["ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
