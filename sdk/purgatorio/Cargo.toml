[package]
name = "purgatorio"
description = "Purgatorio application SDK: Inferno Sys extensions on top of Rust std for wasm32-wasip1"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
purg-abi.workspace = true
purg-auth = { workspace = true, features = ["login"] }
rand_core = { version = "0.6", default-features = false }
purg-styx.workspace = true
# Point, Rect, Chan and Op for the draw module, and memdraw itself for
# programs that draw into a buffer of their own.
purg-memdraw.workspace = true
purgatorio-macros.workspace = true

[lints]
workspace = true
