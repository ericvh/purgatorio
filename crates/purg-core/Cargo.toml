[package]
name = "purg-core"
description = "Portable Purgatorio kernel core: channels, devices, namespaces, progs, Sys file ops"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = ["auth", "tls"]
std = ["purg-platform/std"]
# Mount authentication: Ed25519 proofs for `mount` and `export`, and the
# `#¤` key agent. Without it an export that asks for authentication
# accepts nobody, and `mount` can only attach unauthenticated (`-A`).
auth = ["dep:ed25519-dalek"]
# `#D`, the TLS 1.3 client device.
tls = ["dep:embedded-tls", "dep:p256", "dep:sha2", "dep:embedded-io", "dep:rand_core"]

[dependencies]
purg-abi.workspace = true
purg-styx.workspace = true
purg-platform.workspace = true
ed25519-dalek = { version = "2", default-features = false, optional = true }
embedded-tls = { version = "0.19", default-features = false, features = ["alloc"], optional = true }
p256 = { version = "0.13", default-features = false, features = ["ecdsa", "pkcs8"], optional = true }
sha2 = { version = "0.10", default-features = false, optional = true }
embedded-io = { version = "0.7", default-features = false, optional = true }
rand_core = { version = "0.6", default-features = false, optional = true }

[target.'cfg(loom)'.dev-dependencies]
loom = "0.7"

[lints]
workspace = true

# These tests use `#¤` or check the whole device list.
[[test]]
name = "m3"
required-features = ["auth"]

[[test]]
name = "namespace"
required-features = ["auth", "tls"]
