[package]
name = "purg-lethe"
description = "Lethe, a stateless protocol for static file trees: codec, tickets, server engine and client (docs/lethe.md)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
purg-abi.workspace = true
purg-auth.workspace = true
purg-styx.workspace = true
# The crates purg-auth already uses, so nothing new is linked:
# XChaCha20-Poly1305 is in the crate the record layer uses.
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }
hkdf = { version = "0.12", default-features = false }
sha2 = { version = "0.10", default-features = false }

[lints]
workspace = true
